name: 6C Service Container
on: workflow_dispatch
jobs:
  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - run: sudo apt-get install -y postgresql-client
      - name: Run queries
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -c "CREATE TABLE students(id serial, name text);"
          psql -h localhost -U postgres -d testdb -c "INSERT INTO students(name) VALUES ('YourName');"
          psql -h localhost -U postgres -d testdb -c "SELECT * FROM students;"

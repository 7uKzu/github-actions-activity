name: 4 Secrets and Variables
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use var and secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Variable: ${{ vars.MY_VAR }}"
          echo "Secret: $MY_SECRET"
      - name: REST API call with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }} --jq '.full_name'
          gh api repos/${{ github.repository }}/issues -f title="Created by workflow" -f body="Via GITHUB_TOKEN"
          git log -1 --oneline
